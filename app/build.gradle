plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wanxiang.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wanxiang.client'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'org.webrtc:google-webrtc:1.0.32006'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.15.0'
}
